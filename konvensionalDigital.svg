<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <!-- Pengaturan Font dan Gaya -->
    <style>
      .main-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 800; fill: #0F172A; letter-spacing: 1px; }
      .sub-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #64748B; letter-spacing: 0.5px; }
      
      .phase-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: bold; }
      .phase-sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: normal; }
      
      .dimensi-badge { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; letter-spacing: 0.5px; }
      
      .node-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #334155; }
      .node-text-right { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0369A1; }
      
      .foundation-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #38BDF8; letter-spacing: 1px; }
      .foundation-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 400; fill: #F8FAFC; }
      .foundation-highlight { font-weight: 700; fill: #FDE047; }
    </style>

    <!-- Drop Shadow -->
    <filter id="shadow-soft" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.1" flood-color="#0284C7" />
    </filter>
    <filter id="shadow-dark" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" flood-color="#000000" />
    </filter>

    <!-- Gradient Pilar Kanan (Digital) -->
    <linearGradient id="grad-digital" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Gradient Fondasi Bawah -->
    <linearGradient id="grad-foundation" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Panah (Marker) -->
    <marker id="arrow-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7" />
    </marker>
  </defs>

  <!-- Latar Utama -->
  <rect width="1200" height="850" fill="#F8FAFC" />

  <!-- ==================== HEADER KONSEPTUAL ==================== -->
  <text x="600" y="70" class="main-title" text-anchor="middle">KERANGKA EVOLUSI PARADIGMA SOP</text>
  <text x="600" y="105" class="sub-title" text-anchor="middle">Abstraksi Pergeseran dari Ekosistem Manual Menuju Orkestrasi Otonom</text>
  
  <!-- Elemen Estetika Teori (Kiri: Kotak Terpecah, Kanan: Jaringan Terhubung) -->
  <!-- Kiri -->
  <rect x="50" y="50" width="15" height="15" fill="#E2E8F0" />
  <rect x="75" y="65" width="10" height="10" fill="#CBD5E1" />
  <rect x="55" y="85" width="8" height="8" fill="#94A3B8" />
  <!-- Kanan -->
  <circle cx="1120" cy="60" r="5" fill="#7DD3FC" />
  <circle cx="1150" cy="80" r="7" fill="#38BDF8" />
  <circle cx="1110" cy="95" r="4" fill="#0284C7" />
  <path d="M 1120 60 L 1150 80 L 1110 95 Z" fill="none" stroke="#BAE6FD" stroke-width="2" />

  <!-- ==================== JUDUL PILAR ==================== -->
  <!-- Pilar Kiri -->
  <text x="210" y="150" class="phase-title" fill="#64748B" text-anchor="middle">SOP KONVENSIONAL</text>
  <text x="210" y="172" class="phase-sub" fill="#94A3B8" text-anchor="middle">(Fragmentasi &amp; Manual)</text>
  
  <!-- Pilar Kanan -->
  <text x="990" y="150" class="phase-title" fill="#0284C7" text-anchor="middle">SOP DIGITAL TERINTEGRASI</text>
  <text x="990" y="172" class="phase-sub" fill="#38BDF8" text-anchor="middle">(Orkestrasi &amp; Otonom)</text>


  <!-- ==================== LAYER TRANSFORMASI (NODES) ==================== -->

  <!-- LATAR BELAKANG PILAR KANAN (Visualisasi Ekosistem Terintegrasi) -->
  <rect x="800" y="190" width="380" height="460" rx="20" fill="#F0F9FF" opacity="0.6" stroke="#BAE6FD" stroke-width="2" stroke-dasharray="8,8" />
  <!-- Tulang Punggung (Spine) Integrasi di Kanan -->
  <line x1="1140" y1="230" x2="1140" y2="610" stroke="#38BDF8" stroke-width="4" />

  <!-- ==================== DIMENSI 1: FOKUS EKOSISTEM ==================== -->
  <!-- Node Konvensional (Kiri) -->
  <rect x="50" y="200" width="320" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" />
  <text x="210" y="236" class="node-text" text-anchor="middle">Interaksi fisik antar-manusia</text>
  
  <!-- Koneksi ke Tengah -->
  <line x1="370" y1="230" x2="470" y2="230" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4,4" />
  
  <!-- Dimensi Center Badge -->
  <rect x="470" y="205" width="260" height="50" rx="25" fill="#475569" filter="url(#shadow-soft)" />
  <text x="600" y="237" class="dimensi-badge">FOKUS EKOSISTEM</text>
  
  <!-- Koneksi ke Kanan -->
  <line x1="730" y1="230" x2="825" y2="230" stroke="#0284C7" stroke-width="4" marker-end="url(#arrow-head)" />
  
  <!-- Node Digital (Kanan) -->
  <rect x="830" y="200" width="320" height="60" rx="8" fill="url(#grad-digital)" filter="url(#shadow-soft)" />
  <text x="990" y="236" class="node-text-right" text-anchor="middle">Orkestrasi sistem &amp; manusia</text>
  <circle cx="1140" cy="230" r="6" fill="#0284C7" /> <!-- Titik koneksi sirkuit -->


  <!-- ==================== DIMENSI 2: INISIATOR PROSES ==================== -->
  <rect x="50" y="280" width="320" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" />
  <text x="210" y="316" class="node-text" text-anchor="middle">Inisiatif manual oleh staf</text>
  
  <line x1="370" y1="310" x2="470" y2="310" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4,4" />
  
  <rect x="470" y="285" width="260" height="50" rx="25" fill="#475569" filter="url(#shadow-soft)" />
  <text x="600" y="317" class="dimensi-badge">INISIATOR PROSES</text>
  
  <line x1="730" y1="310" x2="825" y2="310" stroke="#0284C7" stroke-width="4" marker-end="url(#arrow-head)" />
  
  <rect x="830" y="280" width="320" height="60" rx="8" fill="url(#grad-digital)" filter="url(#shadow-soft)" />
  <text x="990" y="316" class="node-text-right" text-anchor="middle">System-Event Trigger otomatis</text>
  <circle cx="1140" cy="310" r="6" fill="#0284C7" />


  <!-- ==================== DIMENSI 3: VALIDASI NASKAH ==================== -->
  <rect x="50" y="360" width="320" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" />
  <text x="210" y="396" class="node-text" text-anchor="middle">Tanda tangan basah &amp; stempel</text>
  
  <line x1="370" y1="390" x2="470" y2="390" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4,4" />
  
  <rect x="470" y="365" width="260" height="50" rx="25" fill="#475569" filter="url(#shadow-soft)" />
  <text x="600" y="397" class="dimensi-badge">VALIDASI NASKAH</text>
  
  <line x1="730" y1="390" x2="825" y2="390" stroke="#0284C7" stroke-width="4" marker-end="url(#arrow-head)" />
  
  <rect x="830" y="360" width="320" height="60" rx="8" fill="url(#grad-digital)" filter="url(#shadow-soft)" />
  <text x="990" y="386" class="node-text-right" text-anchor="middle">Audit Trail &amp;</text>
  <text x="990" y="408" class="node-text-right" text-anchor="middle">Tanda Tangan Elektronik (TTE)</text>
  <circle cx="1140" cy="390" r="6" fill="#0284C7" />


  <!-- ==================== DIMENSI 4: MANAJEMEN RISIKO ==================== -->
  <rect x="50" y="440" width="320" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" />
  <text x="210" y="476" class="node-text" text-anchor="middle">Reaktif, bergantung daya ingat</text>
  
  <line x1="370" y1="470" x2="470" y2="470" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4,4" />
  
  <rect x="470" y="445" width="260" height="50" rx="25" fill="#475569" filter="url(#shadow-soft)" />
  <text x="600" y="477" class="dimensi-badge">MANAJEMEN RISIKO</text>
  
  <line x1="730" y1="470" x2="825" y2="470" stroke="#0284C7" stroke-width="4" marker-end="url(#arrow-head)" />
  
  <rect x="830" y="440" width="320" height="60" rx="8" fill="url(#grad-digital)" filter="url(#shadow-soft)" />
  <text x="990" y="476" class="node-text-right" text-anchor="middle">Preventif, immutable &amp; real-time</text>
  <circle cx="1140" cy="470" r="6" fill="#0284C7" />


  <!-- ==================== DIMENSI 5: PENEMPATAN ARSIP ==================== -->
  <rect x="50" y="520" width="320" height="60" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" />
  <text x="210" y="556" class="node-text" text-anchor="middle">Menunggu petugas pasca dinas</text>
  
  <line x1="370" y1="550" x2="470" y2="550" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4,4" />
  
  <rect x="470" y="525" width="260" height="50" rx="25" fill="#475569" filter="url(#shadow-soft)" />
  <text x="600" y="557" class="dimensi-badge">PENEMPATAN ARSIP</text>
  
  <line x1="730" y1="550" x2="825" y2="550" stroke="#0284C7" stroke-width="4" marker-end="url(#arrow-head)" />
  
  <rect x="830" y="520" width="320" height="60" rx="8" fill="url(#grad-digital)" filter="url(#shadow-soft)" />
  <text x="990" y="556" class="node-text-right" text-anchor="middle">Preservation by design; otonom</text>
  <circle cx="1140" cy="550" r="6" fill="#0284C7" />
  <path d="M 1130 610 L 1150 610" stroke="#38BDF8" stroke-width="4" /> <!-- Ujung bawah sirkuit -->


  <!-- ==================== FONDASI TEORITIS (INSIGHT) ==================== -->
  <!-- Fondasi ini menopang seluruh pilar Kanan (Sistem Baru) -->
  
  <g transform="translate(50, 650)" filter="url(#shadow-dark)">
    <rect x="0" y="0" width="1100" height="130" rx="16" fill="url(#grad-foundation)" />
    
    <!-- Aksen Estetika Fondasi -->
    <rect x="0" y="0" width="16" height="130" fill="#0284C7" rx="8" />
    <path d="M 16 0 L 16 130" stroke="#38BDF8" stroke-width="2" />
    
    <text x="40" y="45" class="foundation-title">SOP SEBAGAI PROTOKOL KORPORAT</text>
    
    <text x="40" y="85" class="foundation-text">
      Bukan lagi sekadar dokumen panduan statis (<tspan fill="#94A3B8" font-style="italic">User Guide</tspan>), melainkan arsitektur pengikat yang menjamin
    </text>
    <text x="40" y="115" class="foundation-text">
      <tspan class="foundation-highlight">SLA (Service Level Agreement)</tspan>, <tspan class="foundation-highlight">Orkestrasi Alur Kerja</tspan>, dan <tspan class="foundation-highlight">Akuntabilitas Keputusan</tspan> secara terotomatisasi.
    </text>
  </g>

</svg>